<article class="card card-holiday">
  <div class="card-header">
    <h2>Următoarea Sărbătoare</h2>
    <span class="muted small">Nager.Date (România)</span>
  </div>

  <div class="holiday-content" style="margin-top: 1rem; text-align: center;">
    <p style="font-size: 1.2rem; font-weight: bold; color: var(--accent-color, #2563eb);">
      🎉 {{ urmatoarea_sarbatoare.nume }}
    </p>
    <span class="muted" style="display: block; margin-top: 0.5rem; font-size: 0.95rem;">
      Data: <strong>{{ urmatoarea_sarbatoare.data }}</strong> 
      (<span style="color: #059669; font-weight: 500;">{{ urmatoarea_sarbatoare.text_zile }}</span>)
    </span>
  </div>
</article>
