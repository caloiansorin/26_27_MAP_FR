<article class="card card-tasks">
  <div class="card-header">
    <h2>Sarcinile zilei</h2>
    <span class="muted">2 din 5 finalizate</span>
  </div>

  <div class="progress">
    <div class="progress-bar" style="width: 40%"></div>
  </div>

  <form class="task-form" action="/sarcini/adauga" method="post">
    <input type="text" name="titlu" placeholder="Sarcină nouă..." required />
    <select name="prioritate">
      <option value="mica">Mică</option>
      <option value="medie" selected>Medie</option>
      <option value="mare">Mare</option>
    </select>
    <button type="submit" class="btn btn-primary">Adaugă</button>
  </form>

  <ul class="task-list">
    <li class="task done">
      <form action="/sarcini/1/bifeaza" method="post">
        <button type="submit" class="check" aria-label="Bifează">✓</button>
      </form>
      <span class="task-title">Citește capitolul 3 la Baze de date</span>
      <span class="badge badge-medie">Medie</span>
      <form action="/sarcini/1/sterge" method="post">
        <button type="submit" class="delete" aria-label="Șterge">✕</button>
      </form>
    </li>
    <li class="task done">
      <form action="/sarcini/2/bifeaza" method="post">
        <button type="submit" class="check" aria-label="Bifează">✓</button>
      </form>
      <span class="task-title">Trimite tema la Programare Web</span>
      <span class="badge badge-mare">Mare</span>
      <form action="/sarcini/2/sterge" method="post">
        <button type="submit" class="delete" aria-label="Șterge">✕</button>
      </form>
    </li>
    <li class="task">
      <form action="/sarcini/3/bifeaza" method="post">
        <button type="submit" class="check" aria-label="Bifează"></button>
      </form>
      <span class="task-title">Pregătește prezentarea pentru seminar</span>
      <span class="badge badge-mare">Mare</span>
      <form action="/sarcini/3/sterge" method="post">
        <button type="submit" class="delete" aria-label="Șterge">✕</button>
      </form>
    </li>
    <li class="task">
      <form action="/sarcini/4/bifeaza" method="post">
        <button type="submit" class="check" aria-label="Bifează"></button>
      </form>
      <span class="task-title">Cumpărături</span>
      <span class="badge badge-mica">Mică</span>
      <form action="/sarcini/4/sterge" method="post">
        <button type="submit" class="delete" aria-label="Șterge">✕</button>
      </form>
    </li>
    <li class="task">
      <form action="/sarcini/5/bifeaza" method="post">
        <button type="submit" class="check" aria-label="Bifează"></button>
      </form>
      <span class="task-title">Sală, ora 19:00</span>
      <span class="badge badge-medie">Medie</span>
      <form action="/sarcini/5/sterge" method="post">
        <button type="submit" class="delete" aria-label="Șterge">✕</button>
      </form>
    </li>
  </ul>
</article>
