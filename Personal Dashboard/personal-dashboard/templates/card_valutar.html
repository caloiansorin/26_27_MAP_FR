<article class="card card-currency">
  <div class="card-header">
    <h2>Curs valutar</h2>
    <span class="muted small">11.11.2026</span>
  </div>

  <table class="rates">
    <tbody>
      <tr>
        <td><strong>EUR</strong></td>
        <td class="muted">Euro</td>
        <td class="num">5,0912 RON</td>
      </tr>
      <tr>
        <td><strong>USD</strong></td>
        <td class="muted">Dolar american</td>
        <td class="num">4,3805 RON</td>
      </tr>
      <tr>
        <td><strong>GBP</strong></td>
        <td class="muted">Liră sterlină</td>
        <td class="num">5,8247 RON</td>
      </tr>
    </tbody>
  </table>

  <form class="converter" action="/home" method="get">
    <input type="number" name="suma" value="100" min="0" step="any" />
    <select name="din">
      <option value="EUR" selected>EUR</option>
      <option value="USD">USD</option>
      <option value="GBP">GBP</option>
      <option value="RON">RON</option>
    </select>
    <span class="arrow">→</span>
    <select name="in">
      <option value="RON" selected>RON</option>
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="GBP">GBP</option>
    </select>
    <button type="submit" class="btn">Convertește</button>
  </form>
  <p class="convert-result">100 EUR = <strong>509,12 RON</strong></p>
</article>
