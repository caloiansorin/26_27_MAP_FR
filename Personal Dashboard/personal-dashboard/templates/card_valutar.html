<article class="card card-currency">
  <div class="card-header">
    <h2>Curs Valutar</h2>
    <span class="muted small">BCE (Frankfurter)</span>
  </div>

  <ul class="currency-list">
    <li class="currency-item">
      <span class="currency-name">💶 EUR</span>
      <span class="currency-value"><strong>{{ curs_valutar.EUR }}</strong> RON</span>
    </li>
    <li class="currency-item">
      <span class="currency-name">💵 USD</span>
      <span class="currency-value"><strong>{{ curs_valutar.USD }}</strong> RON</span>
    </li>
    <li class="currency-item">
      <span class="currency-name">💷 GBP</span>
      <span class="currency-value"><strong>{{ curs_valutar.GBP }}</strong> RON</span>
    </li>
  </ul>
  <div class="card-footer muted small" style="margin-top: 1rem; text-align: right;">
    Actualizat la: {{ curs_valutar.data }}
  </div>
</article>
